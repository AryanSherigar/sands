[project]
name = "simulation"
version = "0.1.0"
description = "Deterministic strategy-mode simulation service for sands"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "psycopg[binary]>=3.3.6,<4",
    "psycopg_pool>=3.2,<4",
    "structlog>=24.1.0",
    "pyjwt>=2.15.1",
    "strategy-contracts",
    "httpx>=0.27",
]

[tool.uv.sources]
strategy-contracts = { path = "../../packages/strategy-contracts", editable = true }

[dependency-groups]
dev = [
    "hypothesis>=6.170.8",
    "import-linter>=2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m \"not headless_long\""
markers = [
    "headless_long: long multi-seed AI-vs-AI balance runs; opt in with -m headless_long",
]

[tool.importlinter]
root_packages = ["app"]

[[tool.importlinter.contracts]]
name = "Router -> Service -> Repository | Integration | Engine layering"
type = "layers"
layers = [
    "app.main",
    "app.routers",
    "app.services",
    "app.repositories | app.integrations | app.engine",
    "app.middleware",
    "app.db | app.logging",
    "app.models | app.exceptions | app.config",
]

[[tool.importlinter.contracts]]
name = "Engine is pure: it sees only models and exceptions"
type = "forbidden"
source_modules = ["app.engine"]
forbidden_modules = [
    "app.config",
    "app.db",
    "app.logging",
    "app.middleware",
    "app.repositories",
    "app.integrations",
    "app.services",
    "app.routers",
]
