[project]
name = "turn-resolution-service"
version = "0.1.0"
description = "Turn Resolution Service for sands"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "structlog>=24.1.0",
    "pyjwt>=2.15.1",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "sse-starlette>=2.1.0",
    "google-genai>=1.75.0,<3.0.0",
    "anthropic[vertex]==1.13.0",
    "google-auth>=2.30",
    "requests>=2.32",
    "tenacity>=9.0.0,<10.0.0",
    "strategy-contracts",
    "openai>=3.0.0,<4.0.0",
    "python-multipart>=0.0.32",
    "av>=14.0.0,<20",
]

[tool.uv.sources]
strategy-contracts = { path = "../../packages/strategy-contracts", editable = true }

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = [".", "../../packages/strategy-contracts"]
addopts = "-m \"not live_scene\""
markers = [
    "live_scene: opt-in scene tests against live Muse; need MUSE_API_KEY and spend tokens from the live budget, run with -m live_scene.",
    "integration: full-stack test against a live docker-compose deployment (real Postgres, memory service); requires `docker compose up -d` first and is skipped otherwise.",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.2",
]
