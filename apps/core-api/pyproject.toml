[project]
name = "core-api"
version = "0.1.0"
description = "Core API service for sands"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0,<10.0.0",
    "firebase-admin>=6.5.0",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "google-auth>=2.30",
    "google-genai>=1.75.0,<3.0.0",
    "mutagen>=1.47.0",
    "strategy-contracts",
]

[tool.uv.sources]
strategy-contracts = { path = "../../packages/strategy-contracts", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "respx>=0.20.0",
    "ruff>=0.5.0",
    "pillow>=12.0.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
