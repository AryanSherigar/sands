# Cloudflare Worker that fronts the Cloud Run backends for the hackathon demo.
# Deployed with `npx wrangler deploy`: see docs/arch/infra/demo-deploy-runbook.md.
name = "sands-edge-proxy"
main = "src/index.ts"
compatibility_date = "2026-10-27"

# No custom domain and no public Worker URL. The only way in is the Pages
# Function in pages/functions, which reaches this Worker over a service binding,
# so the Worker stays the single entry to the backends.
workers_dev = false
preview_urls = false

# Cron triggers run at most once a minute. The relay endpoint is idempotent.
[triggers]
crons = ["* * * * *"]

# Media is served from here, so the R2 bucket needs no public URL.
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "sands-demo-media"

# NOTE: the Cloud Run origins are not in this file because they exist only after
# the services are deployed. Pass them at deploy time:
#   npx wrangler deploy \
#     --var CORE_API_ORIGIN:https://core-api-<project-number>.us-central1.run.app \
#     --var TRS_ORIGIN:https://turn-resolution-service-<project-number>.us-central1.run.app \
#     --var SIMULATION_ORIGIN:https://simulation-<project-number>.us-central1.run.app
#
# Secrets, set with `wrangler secret put`, never in this file:
#   INTERNAL_PROXY_TOKEN, INTERNAL_SERVICE_TOKEN
