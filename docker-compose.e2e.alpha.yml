# Stacks on docker-compose.e2e.night-desk.yml: turns alpha mode on for Core API and
# TRS with Night Desk as the only playable scenario (its id is the uuid5 the
# generator derives, see apps/core-api/scripts/night_desk/ids.py).
#
#   docker compose -p sands-e2e -f docker-compose.yml -f docker-compose.e2e.yml \
#     -f docker-compose.e2e.night-desk.yml -f docker-compose.e2e.alpha.yml \
#     up -d --build postgres migration-runner core-api turn-resolution-service
#   (cd apps/turn-resolution-service && .venv/bin/python scripts/alpha_perimeter_e2e.py)
#   docker compose -p sands-e2e -f docker-compose.yml -f docker-compose.e2e.yml \
#     -f docker-compose.e2e.night-desk.yml -f docker-compose.e2e.alpha.yml down -v

services:
  core-api:
    environment:
      IS_ALPHA_MODE: "true"
      ALPHA_SCENARIO_ID: 247790a8-ab60-53ea-aa27-dd3029a9db56
      ALPHA_PUBLIC_URL: http://127.0.0.1:5173

  turn-resolution-service:
    environment:
      IS_ALPHA_MODE: "true"
      ALPHA_SCENARIO_ID: 247790a8-ab60-53ea-aa27-dd3029a9db56
