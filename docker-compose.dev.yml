name: sands

services:
  core-api:
    command: ["uvicorn", "app.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${CORE_API_PORT:-8000}:8000"
    # NOTE: The dev Vite server calls core-api/TRS directly, with no nginx in
    # front, so the proxy-token gate is off and the client IP is the socket peer.
    environment:
      INTERNAL_PROXY_TOKEN: ""
      TRUSTED_PROXY_HOPS: "0"
    volumes:
      - ./apps/core-api:/app
      - ./packages/strategy-contracts:/app/strategy-contracts:ro

  migration-runner:
    volumes:
      - ./apps/core-api:/app
      - ./packages/strategy-contracts:/app/strategy-contracts:ro

  turn-resolution-service:
    command: ["uvicorn", "app.main:app", "--reload", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "${TRS_PORT:-8001}:8001"
    environment:
      INTERNAL_PROXY_TOKEN: ""
      TRUSTED_PROXY_HOPS: "0"
    volumes:
      - ./apps/turn-resolution-service:/app

  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  memory:
    ports:
      - "127.0.0.1:${MEMORY_PORT:-8080}:8080"
    environment:
      # NOTE: Query embedding from a dev machine takes about 700 ms against the
      # 300 ms in-region budget, which would skip the vector branch every turn.
      RETRIEVAL_EMBED_TIMEOUT_SECONDS: "3.0"

  simulation:
    ports:
      - "127.0.0.1:${SIMULATION_PORT:-8081}:8081"

  frontend:
    build: !override
      context: ./apps/frontend
      dockerfile: Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: sands-frontend-dev
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    ports: !override
      - "${FRONTEND_PORT:-5173}:5173"
    healthcheck: !override
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    environment:
      # Hardcoded: the dev Vite server talks to core-api/TRS directly, not
      # through nginx, so it must ignore the /api, /trs prod defaults in .env.
      VITE_CORE_API_URL: http://localhost:8000
      VITE_TRS_URL: http://localhost:8001
      DEV_PROXY_CORE_API_TARGET: http://core-api:8000
      DEV_PROXY_TRS_TARGET: http://turn-resolution-service:8001
      DEV_PROXY_SIMULATION_TARGET: http://simulation:8081
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
      VITE_MEASUREMENT_ID: ${VITE_MEASUREMENT_ID:-}
